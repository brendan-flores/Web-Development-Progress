<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
        <div class="profile-info">
            <div class="profile-avatar">
                <p>pic</p>
            </div>

            <div class="profile-text">
                <h2 class="profile-name">Alex Morgan</h2>
                <p class="profile-role">Frontend Developer</p>
            </div>
            
            <p class="profile-status">Online</p>
        </div>

        <div class="profile-stats">
            <div class="stat-item">
                <h3>24</h3>
                <p>Projects</p>
            </div>
            
            <div class="stat-item">
                <h3>12k</h3>
                <p>Followers</p>
            </div>

            <div class="stat-item">
                <h3>850</h3>
                <p>Likes</p>
            </div>
        </div>
        <button class="follow-button">Follow</button>
    </div>
</body>
</html>
